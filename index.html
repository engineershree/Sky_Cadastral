    <!-- Defensive Global Performance Shim & Extension Error Guard -->
    <script type="text/javascript">
      (function() {
        if (typeof window !== 'undefined') {
          if (window.performance) {
            var safeEntry = function(e) {
              if (e && typeof e === 'object') {
                if (e.startTime === undefined) e.startTime = 0;
                if (e.duration === undefined) e.duration = 0;
              }
              return e;
            };
            ['getEntries', 'getEntriesByName', 'getEntriesByType'].forEach(function(fn) {
              if (typeof window.performance[fn] === 'function') {
                var orig = window.performance[fn];
                window.performance[fn] = function() {
                  var res = orig.apply(this, arguments);
                  if (Array.isArray(res)) return res.map(safeEntry);
                  return res;
                };
              }
            });
          }
          window.addEventListener('error', function(e) {
            if (e && e.message && (e.message.indexOf('startTime') !== -1 || e.message.indexOf('reportAllChanges') !== -1)) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>
    <!-- GitHub Pages SPA Route Restoration Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).filter(function(s) {
            return s.slice(0, 2) === 'p='
          })[0].slice(2);
          if (decoded) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        }
      }(window.location));
    </script>
