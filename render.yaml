services:
  - type: web
    name: sky-cadastral-admin
    env: static
    rootDir: SkyCadastralAdmin/Admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sky-cadastral.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
