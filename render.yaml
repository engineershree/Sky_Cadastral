services:
  - type: web
    name: sky-cadastral-admin
    env: node
    buildCommand: python3 -m pip install --break-system-packages -r Backend/requirements.txt || pip install -r Backend/requirements.txt || true; npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false

