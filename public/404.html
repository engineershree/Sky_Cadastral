<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Cadastral - Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA Single Page Apps redirect script
      // Redirects 404 requests to index.html with route preserved in query string
      (function() {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 50px; color: #333;">
      <h2>Redirecting to Sky Cadastral App...</h2>
    </div>
  </body>
</html>
